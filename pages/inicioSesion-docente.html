<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/Style.css">

</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-10">
                <article class="card shadow border-1">
                    <div class="card-body p-5 text-center">
                        <h3 class="fw-bold mb-4">BIENVENIDO AL<br>CONTROL DE VISITAS - ITR</h3>

                        <!-- Cambia entre los dos portales. La marcada es en la que se esta. -->
                        <nav class="login-pestanas mb-4" aria-label="Tipo de usuario">
                            <a href="inicioSesion-docente.html" class="login-pestana activa" aria-current="page">Docente</a>
                            <a href="inicioSesion-admin.html" class="login-pestana">Administración</a>
                        </nav>

                        <div class="mb-4">
                            <img src="../img/logoRicaldone.png" alt="Logo Ricaldone" class="img-fluid rounded"
                                style="max-height: 180px;">
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <input type="email"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Correo" id="loginCorreo" required
                                    autocomplete="email" style="background-color: #1F2937;">
                            </div>
                            <div class="mb-4">
                                <input type="password"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Contraseña" id="loginContrasena" required
                                    autocomplete="current-password" style="background-color: #1F2937;">
                            </div>

                            <button type="submit" class="btn btn-lg w-100 py-3 text-white rounded-3"
                                style="background-color: #1F2937; border: none;">
                                Iniciar Sesión
                            </button>

                            <a href="recuperarPassword.html?origen=docente" class="login-olvido">
                                Olvidé mi contraseña
                            </a>
                        </form>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script type="module" src="../js/Docentes/Controller/InicioSesionController.js"></script>
   
    <script type="module" src="../js/verContrasena.js"></script>
</body>
</html>
