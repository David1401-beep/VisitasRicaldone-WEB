<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Style.css">
</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-10">
                <article class="card shadow border-1">
                    <div class="card-body p-5 text-center">
                        <h3 class="fw-bold mb-4">RECUPERAR<br>CONTRASEÑA</h3>

                        <div class="mb-4">
                            <img src="../img/logoRicaldone.png" alt="Logo Ricaldone" class="img-fluid rounded"
                                style="max-height: 140px;">
                        </div>

                        <!-- Aqui salen los avisos de error y de exito -->
                        <div id="recuperarMensaje" class="alert d-none text-start" role="alert"></div>

                        <!-- Paso 1: pedir el correo -->
                        <form id="formCorreo">
                            <p class="text-muted text-start">
                                Escriba el correo con el que entra al sistema y le enviaremos
                                un código de 6 dígitos.
                            </p>

                            <div class="mb-4 text-start">
                                <label for="recuperarCorreo" class="visually-hidden">Correo</label>
                                <!-- Aqui no exijo el dominio del colegio: quien decide si el
                                     correo sirve es la base, no la pantalla. -->
                                <input type="email"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Correo"
                                    id="recuperarCorreo"
                                    autocomplete="email"
                                    required
                                    style="background-color: #1F2937;">
                            </div>

                            <button type="submit" id="btnEnviarCodigo"
                                class="btn btn-lg w-100 py-3 text-white rounded-3"
                                style="background-color: #1F2937; border: none;">
                                Enviar código
                            </button>
                        </form>

                        <!-- Paso 2: escribir el codigo que llego al correo -->
                        <form id="formCodigo" hidden>
                            <p class="text-muted text-start">
                                Revise su correo y escriba el código de 6 dígitos.
                                Vence en 10 minutos.
                            </p>

                            <div class="mb-4 text-start">
                                <label for="recuperarCodigo" class="visually-hidden">Código</label>
                                <input type="text"
                                    class="form-control form-control-lg text-white border-0 py-3 text-center custom-placeholder"
                                    placeholder="000000"
                                    id="recuperarCodigo"
                                    inputmode="numeric"
                                    maxlength="6"
                                    pattern="[0-9]{6}"
                                    title="El código son 6 dígitos"
                                    autocomplete="one-time-code"
                                    required
                                    style="background-color: #1F2937; letter-spacing: 8px;">
                            </div>

                            <button type="submit" id="btnVerificarCodigo"
                                class="btn btn-lg w-100 py-3 text-white rounded-3"
                                style="background-color: #1F2937; border: none;">
                                Continuar
                            </button>

                            <button type="button" id="btnReenviar" class="btn btn-link mt-3">
                                Enviar otro código
                            </button>
                        </form>

                        <!-- Paso 3: la contrasena nueva -->
                        <form id="formPassword" hidden>
                            <p class="text-muted text-start">
                                Escriba su contraseña nueva. Debe tener al menos 6 caracteres.
                            </p>

                            <div class="mb-3 text-start">
                                <label for="passwordNueva" class="visually-hidden">Contraseña nueva</label>
                                <input type="password"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Contraseña nueva"
                                    id="passwordNueva"
                                    minlength="6"
                                    autocomplete="new-password"
                                    required
                                    style="background-color: #1F2937;">
                            </div>

                            <div class="mb-4 text-start">
                                <label for="passwordRepetida" class="visually-hidden">Repetir contraseña</label>
                                <input type="password"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Repetir contraseña"
                                    id="passwordRepetida"
                                    minlength="6"
                                    autocomplete="new-password"
                                    required
                                    style="background-color: #1F2937;">
                            </div>

                            <button type="submit" id="btnCambiarPassword"
                                class="btn btn-lg w-100 py-3 text-white rounded-3"
                                style="background-color: #1F2937; border: none;">
                                Cambiar contraseña
                            </button>
                        </form>

                        <a href="inicioSesion-admin.html" id="enlaceVolver" class="d-inline-block mt-3">
                            Volver al inicio de sesión
                        </a>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/RecuperacionController.js"></script>
</body>

</html>
