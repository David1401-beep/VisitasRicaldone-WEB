<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Personal ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Style.css">
</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-10">
                <article class="card shadow border-1">
                    <div class="card-body p-5 text-center">
                        <h3 class="fw-bold mb-4">ADMINISTRACIÓN DEL<br>CONTROL DE VISITAS - ITR</h3>

                        <div class="mb-4">
                            <img src="../img/logoRicaldone.png" alt="Logo Ricaldone" class="img-fluid rounded"
                                style="max-height: 180px;">
                        </div>

                        <form id="loginAdminForm">
                            <div class="mb-3 text-start">
                                <label for="loginAdminCorreo" class="visually-hidden">Correo institucional</label>
                                <input type="email"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Correo institucional"
                                    id="loginAdminCorreo"
                                    pattern="^[^@\s]+@ricaldone\.edu\.sv$"
                                    title="El correo debe terminar en @ricaldone.edu.sv"
                                    autocomplete="email"
                                    required
                                    style="background-color: #1F2937;">
                            </div>

                            <div class="mb-4 text-start">
                                <label for="loginAdminContrasena" class="visually-hidden">Contraseña</label>
                                <input type="password"
                                    class="form-control form-control-lg text-white border-0 py-3 custom-placeholder"
                                    placeholder="Contraseña"
                                    id="loginAdminContrasena"
                                    autocomplete="current-password"
                                    required
                                    style="background-color: #1F2937;">
                            </div>

                            <button type="submit" id="btnIngresarAdmin"
                                class="btn btn-lg w-100 py-3 text-white rounded-3"
                                style="background-color: #1F2937; border: none;">
                                Iniciar Sesión
                            </button>

                            <a href="../Docentes/InicioSesion.html" class="d-inline-block mt-3">
                                Ingresar como docente
                            </a>
                        </form>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/Admin/Controller/InicioSesionController.js"></script>
</body>

</html>
